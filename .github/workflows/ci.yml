# PR-based CI for the Keplura foundation.
# Checks only what really exists in the repo: the Maven server (Spring Boot,
# Java 21), the Vue/Vite desktop frontend build, and a `cargo check` of the
# Tauri 2 Rust shell on Linux (the platform with the WebKitGTK system deps).
name: CI

on:
  pull_request:
    branches: [main]

# Least privilege for the GITHUB_TOKEN (public-repo hardening): the jobs only
# check out and build; nothing writes to the repository.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  server:
    name: Server (mvn verify)
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Build and test
        run: mvn -B verify

  desktop-build:
    name: Desktop frontend (npm build)
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Build (vue-tsc + vite)
        run: npm run build

  tauri-check:
    name: Desktop Tauri shell (cargo check, Linux)
    runs-on: ubuntu-latest
    env:
      TAURI_DIR: desktop/src-tauri
    steps:
      - uses: actions/checkout@v7
      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf
      - uses: actions/cache@v6
        with:
          path: |
            desktop/src-tauri/target
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-check-${{ hashFiles('desktop/src-tauri/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-check-
      - name: Cargo check
        working-directory: desktop/src-tauri
        run: cargo check --all-targets

  # ADR-0005 (M2-POLISH, PO evidence mandate): the native-HTTP cookie
  # persistence contract must be proven on every bundle target platform.
  # GUI E2E of the packaged app runs locally on Linux/Xvfb (desktop/e2e/,
  # report attached to the PR); Windows/macOS runners get the honest minimum:
  # the app + plugin build for real, and the headless Rust-side cookie-jar
  # test that pins tauri-plugin-http's persist/reload semantics.
  tauri-cookie-native:
    name: Desktop native cookie-persistence test (Win/mac)
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    env:
      TAURI_DIR: desktop/src-tauri
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/cache@v6
        with:
          path: |
            desktop/src-tauri/target
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-test-${{ hashFiles('desktop/src-tauri/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-test-
      - name: Build + cookie persistence test
        working-directory: desktop/src-tauri
        # cookie_jar_permissions = M3-HARDEN: 0600 tightening of the plugin's
        # .cookies jar (unix asserts real modes; Windows pins the no-op).
        run: cargo test --test cookie_persistence --test cookie_jar_permissions
