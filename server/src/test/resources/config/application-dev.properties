# TEST-ONLY override of the dev profile (loaded from classpath:/config/, which
# takes precedence over the main application-dev.properties).
#
# Every Spring test runs under the dev profile (spring.profiles.active=dev in
# application.properties). Since the dev profile builds its schema with Flyway,
# this file keeps the tests on their previous path: Hibernate-built schema,
# Flyway off, unless a test opts in explicitly (e.g. ChatApiIntegrationTest sets
# spring.flyway.enabled=true itself). DevProfileSchemaTest checks the REAL dev
# settings from the main resources.
spring.datasource.url=jdbc:h2:file:./target/keplura-dev;AUTO_SERVER=TRUE
spring.jpa.hibernate.ddl-auto=update
spring.flyway.enabled=false
