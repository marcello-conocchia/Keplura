spring.application.name=keplura-server

# Operator-managed routes for admin connection tests and MCP; closed by default.
keplura.admin.ssrf-allow-cidrs=${KEPLURA_ADMIN_SSRF_ALLOW_CIDRS:}

# PILOT-02: internal TEI endpoint. Empty keeps the hermetic dev/test path.
keplura.search.reranker-url=${KEPLURA_RERANKER_URL:}
keplura.search.reranker-min-score=${KEPLURA_RERANKER_MIN_SCORE:0.5}
keplura.search.reranker-timeout-seconds=${KEPLURA_RERANKER_TIMEOUT_SECONDS:60}

# Base configuration (profile-independent). Operational profiles extend this file:
# application-dev.properties (loaded by default) and application-prod.properties
# (activate with SPRING_PROFILES_ACTIVE=prod). An explicit SPRING_PROFILES_ACTIVE
# always overrides the default below. Never put secrets in any profile file.
spring.profiles.active=dev

server.port=8080

# Values published through GET /api/v1/system/info.
# @project.version@ is resolved by Maven resource filtering (see spring-boot-starter-parent).
keplura.product=Keplura Server
keplura.server-version=@project.version@
keplura.api-version=v1

# Session defaults for the M2b login endpoint (docs/adr/0003): the session
# cookie is HttpOnly (no JS access), SameSite=Lax (CSRF posture), cookie-only
# tracking (no URL rewriting of the session id). Secure and the cookie name
# are profile-specific (dev: plain-HTTP localhost; prod: HTTPS required).
#
# Unauthenticated sessions (e.g. a pending OIDC login) keep the short timeout.
# Authenticated sessions use a 30-day absolute lifetime, without a 30-minute
# inactivity logout. Remember-me only controls whether the cookie survives quit.
keplura.auth.session-lifetime-seconds=2592000
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.tracking-modes=cookie

# M3c document upload: base directory for stored bytes (ENV
# KEPLURA_UPLOAD_DIR; relative values resolve against the working dir — a
# real deployment points it at a dedicated data volume) and the per-document
# size limit (default 20 MiB).
#
# M3d hardening (b): ONE size limit, ONE environment variable.
# KEPLURA_UPLOAD_MAX_BYTES drives both the app-level policy check and the
# multipart container limits (a plain number is interpreted as bytes by
# Spring's DataSize binding), so the declared size, the measured copy and the
# container framing cap can no longer drift apart through two ENV names.
# The copy loop in DocumentStorage aborts AT the cap (hardening (a)) — bytes
# beyond the limit are never written to disk.
keplura.upload.dir=${KEPLURA_UPLOAD_DIR:./data/uploads}
keplura.upload.max-size-bytes=${KEPLURA_UPLOAD_MAX_BYTES:20971520}
spring.servlet.multipart.max-file-size=${KEPLURA_UPLOAD_MAX_BYTES:20971520}
spring.servlet.multipart.max-request-size=${KEPLURA_UPLOAD_MAX_BYTES:20971520}
spring.servlet.multipart.file-size-threshold=2MB
# Tomcat's swallow budget must cover the ENTIRE unread remainder of a rejected
# body or Tomcat resets the connection instead of delivering the 413 JSON
# (observed as client-visible connection aborts on CI runners when uploads
# exceed the request cap by more than the budget). Unlimited is the documented
# Tomcat practice for this: the bytes are streamed and discarded (never buffered),
# the request is already terminal, and per-connection read/idle bounds stay in
# force — the cost is a rejected client making us read junk it already sent.
server.tomcat.max-swallow-size=-1

# M3d RAG pipeline: chunking, embedding backend and the search vector store.
# The chunker splits TEXTUAL documents (txt/md/csv) character-wise with
# overlap; chunk-size-chars >= chunk-overlap-chars AND
# chunk-size-chars <= 4000 (the kb_chunk.chunk_text column bound, V4) are
# validated at startup (a drift that could loop forever or smuggle oversized
# rows must fail the boot, not 500 per upload).
keplura.search.chunk-size-chars=${KEPLURA_CHUNK_SIZE_CHARS:800}
keplura.search.chunk-overlap-chars=${KEPLURA_CHUNK_OVERLAP_CHARS:100}
# A query longer than this is rejected 400 BEFORE any work happens; the KNN
# scan is bounded per-chunk, so topK also caps at 50 server-side.
keplura.search.max-query-chars=${KEPLURA_MAX_QUERY_CHARS:4000}
# Embedding backend: "local" (default) is the deterministic hash-based dev/CI
# implementation — NEVER a semantic model. "gateway" selects the OpenAI-
# compatible /v1/embeddings client and REQUIRES base-url to be set; prod must
# set KEPLURA_EMBEDDING_BACKEND=gateway plus KEPLURA_EMBEDDING_BASE_URL /
# KEPLURA_EMBEDDING_API_KEY / KEPLURA_EMBEDDING_MODEL out-of-band.
keplura.search.embedding-backend=${KEPLURA_EMBEDDING_BACKEND:local}
keplura.search.embedding-model=${KEPLURA_EMBEDDING_MODEL:local-hash-64}
keplura.search.embedding-dim=${KEPLURA_EMBEDDING_DIM:64}
keplura.search.embedding-base-url=${KEPLURA_EMBEDDING_BASE_URL:}
keplura.search.embedding-api-key=${KEPLURA_EMBEDDING_API_KEY:}
keplura.search.embedding-timeout-seconds=${KEPLURA_EMBEDDING_TIMEOUT_SECONDS:30}
# Vector store: "auto" uses native pgvector when the DataSource really is
# PostgreSQL with the extension installed, and falls back to in-JVM cosine
# similarity otherwise (H2 dev/test path). Pin with KEPLURA_SEARCH_STORE to
# "memory" or "pgvector" (e.g. a deployment that must not start without the
# extension: KEPLURA_SEARCH_STORE=pgvector fails the boot loudly).
keplura.search.store=${KEPLURA_SEARCH_STORE:auto}
# ADR-0010: on PostgreSQL the pgvector twin column follows
# keplura.search.embedding-dim automatically WHILE THE INDEX IS EMPTY (fresh
# install, e.g. bge-m3 = 1024). A populated index is never retyped; a
# mismatch then falls back (auto) or fails the boot (pgvector). Set false to
# forbid the automatic ALTER entirely.
# Indexing: "sync" (default) parses + embeds inside the upload request (errors
# answer 400); "async" stores the document with status PENDING, returns at
# once and indexes in the background (status INDEXED / NO_TEXT_LAYER / FAILED).
keplura.indexing.mode=${KEPLURA_INDEXING_MODE:sync}
keplura.indexing.workers=${KEPLURA_INDEXING_WORKERS:1}
keplura.search.auto-adapt-dimension=${KEPLURA_SEARCH_AUTO_ADAPT_DIMENSION:true}
# Search reads never go outside the upload tree either; this stays on the same
# ENV as the doc policy above (one cap = one variable).
keplura.search.max-doc-bytes=${KEPLURA_UPLOAD_MAX_BYTES:20971520}

# MVP-5 document parsing (Apache Tika: pdf via PDFBox, docx via POI-OOXML).
# Extraction runs in-process on a bounded pool; these are the DoS gates —
# every one fails an upload honestly (400/503), never a truncated index:
#  - extracted-chars: hard cap on characters an extraction may produce
#    (Tika write limit; a content-stream bomb dies AT the cap)
#  - pdf-max-pages: structural PDF page pre-count cap (rejects a page bomb
#    BEFORE any text work; a PageRangeRequest window backstops it parser-side)
#  - docx-max-pages: cap on the OPC 'Pages' app-property when present
#  - max-entry-count: OPC zip entry cap via POI ZipSecureFile (zip bombs);
#    the static guard is JVM-global, so it is re-applied before EVERY parse
#    rather than trusted from a one-time init (multiple Spring contexts)
#  - timeout-seconds: wall-clock per parse; a timed-out upload is rejected
#    (the worker may linger, bounded by max-concurrency — see the extractor
#    javadoc for the honest abandonment caveat)
#  - max-concurrency: parallel parser threads; at capacity further uploads
#    answer 503 immediately rather than queueing
keplura.parser.extracted-chars=${KEPLURA_PARSER_MAX_CHARS:2000000}
keplura.parser.pdf-max-pages=${KEPLURA_PARSER_PDF_MAX_PAGES:500}
keplura.parser.docx-max-pages=${KEPLURA_PARSER_DOCX_MAX_PAGES:200}
keplura.parser.max-entry-count=${KEPLURA_PARSER_MAX_ENTRY_COUNT:5000}
keplura.parser.timeout-seconds=${KEPLURA_PARSER_TIMEOUT_SECONDS:60}
keplura.parser.max-concurrency=${KEPLURA_PARSER_CONCURRENCY:2}

# OCR-01 — lokale Texterkennung (Tesseract) für PDF-Seiten ohne Textschicht.
# Läuft NACH dem begrenzten Parse auf genau einem eigenen Arbeiter; fehlt
# Tesseract oder eine Sprache, bleibt ein Scan ehrlich NO_TEXT_LAYER.
#  - languages: Tesseract-Sprachpakete, z. B. deu+eng (im Server-Image enthalten)
#  - max-pages: erkannte Seiten je Dokument (Chat-Anhänge: höchstens 10)
#  - page-/total-timeout-seconds: Prozess wird je Seite hart beendet
keplura.ocr.enabled=${KEPLURA_OCR_ENABLED:true}
keplura.ocr.command=${KEPLURA_OCR_COMMAND:tesseract}
keplura.ocr.languages=${KEPLURA_OCR_LANGS:deu+eng}
keplura.ocr.dpi=${KEPLURA_OCR_DPI:300}
keplura.ocr.max-pages=${KEPLURA_OCR_MAX_PAGES:100}
keplura.ocr.page-timeout-seconds=${KEPLURA_OCR_PAGE_TIMEOUT_SECONDS:60}
keplura.ocr.total-timeout-seconds=${KEPLURA_OCR_TOTAL_TIMEOUT_SECONDS:900}

# M4a model gateway (chat-completions proxy; the desktop NEVER holds an API
# key). base-url points at an OpenAI-compatible server (vLLM/Ollama/managed);
# empty = gateway off (GET /api/v1/gateway/status reports configured=false,
# POST /chat/completions answers 503 before any upstream call). The key is
# ENV-only (prod), the dev/test default stays empty — nothing secret in any
# committed file. allowed-models is an optional comma list pinning which
# models the shared key may serve; empty = any model the upstream knows.
#
# M4c first-class providers: KEPLURA_PROVIDER selects a preset — "ollama"
# (local box, http://127.0.0.1:11434/v1, no key), "vllm" (GPU server,
# http://127.0.0.1:8000/v1, no key) or "api" (hosted OpenAI-compatible,
# https://api.openai.com/v1, REQUIRES KEPLURA_GATEWAY_API_KEY). A preset
# only fills the base-url/model DEFAULTS — the raw gateway vars below still
# override per value, and an unknown provider name fails the boot loudly
# (never a silent fallback). Empty = legacy raw-config path (M4a behaviour).
keplura.provider=${KEPLURA_PROVIDER:}
keplura.gateway.base-url=${KEPLURA_GATEWAY_BASE_URL:}
keplura.gateway.api-key=${KEPLURA_GATEWAY_API_KEY:}
keplura.gateway.allowed-models=${KEPLURA_GATEWAY_ALLOWED_MODELS:}
# Timeouts/bounds: connect+response-header timeout per upstream call; an SSE
# stream additionally dies after the idle gap and at the hard total deadline;
# request/response byte caps plus per-message sanity caps all reject/stop
# before an unbounded payload can pin the proxy (502/413/400, no internals
# revealed).
keplura.gateway.timeout-seconds=${KEPLURA_GATEWAY_TIMEOUT_SECONDS:30}
keplura.gateway.stream-idle-seconds=${KEPLURA_GATEWAY_STREAM_IDLE_SECONDS:60}
keplura.gateway.stream-deadline-seconds=${KEPLURA_GATEWAY_STREAM_DEADLINE_SECONDS:300}
keplura.gateway.max-request-bytes=${KEPLURA_GATEWAY_MAX_REQUEST_BYTES:1048576}
keplura.gateway.max-response-bytes=${KEPLURA_GATEWAY_MAX_RESPONSE_BYTES:8388608}
keplura.gateway.max-message-chars=${KEPLURA_GATEWAY_MAX_MESSAGE_CHARS:65536}
keplura.gateway.max-messages=${KEPLURA_GATEWAY_MAX_MESSAGES:256}

# M4b chat flow (server-side chat orchestration over the M4a gateway). The
# model NAME is pinned here deliberately — a model-picker UI is a documented
# Non-Goal of M4b, and the name is an operational pin, never a secret (it
# surfaces as the assistant-message audit tag). Since M4c the default is
# EMPTY = "whatever the provider preset serves" (ollama -> qwen2.5:0.5b,
# vllm -> default, api -> gpt-4o-mini); an explicit KEPLURA_CHAT_MODEL
# always wins, and without any preset the dev stand-in local-chat-dev stays.
# context-messages caps how much transcript rides upstream; rag-top-k bounds
# the RAG grounding per kb-scoped turn (same cap as the search API: 50);
# max-prompt-chars is the per-message edge; context-chunk-chars caps each
# pasted chunk (bounds the gateway request together with rag-top-k).
# max-tokens caps the upstream completion; 0 = omit the field and let the
# backend decide — EXCEPT on the ollama preset, where 0 resolves to the
# validator clamp 1024 (Ollama's compat layer has no length default; without
# a cap a tiny model can ramble to the stream deadline).
keplura.chat.model=${KEPLURA_CHAT_MODEL:}
keplura.chat.context-messages=${KEPLURA_CHAT_CONTEXT_MESSAGES:20}
keplura.chat.rag-top-k=${KEPLURA_CHAT_RAG_TOP_K:4}
keplura.chat.max-prompt-chars=${KEPLURA_CHAT_MAX_PROMPT_CHARS:4000}
keplura.chat.context-chunk-chars=${KEPLURA_CHAT_CONTEXT_CHUNK_CHARS:700}
keplura.chat.max-tokens=${KEPLURA_CHAT_MAX_TOKENS:0}

# OIDC-M2-Tail (docs/adr/0009): the SECOND login path (authorization code +
# PKCE). Provider config (issuer, discovery URL, client id/secret) lives in
# DB rows managed through /api/v1/admin/oidc/providers — NOT here (ADR-0009
# §2); the client secret rides SecretCipher's KEPLURA_SECRETS_MASTER_KEY
# boundary (same ENV as the AI provider keys). What stays in the environment
# is purely operational and never secret:
#  - desktop-redirect-uri: the FIXED handoff target the callback bails the
#    browser out to after a successful login (ADR-0009 §7). Must be absolute
#    http(s)/tauri without query/fragment — a bad value fails the boot.
#    Dev default: the Vite origin (browser QA flow). Packaged deployments
#    set tauri://localhost/ (macOS/Linux) or http://tauri.localhost/ (Windows).
#  - public-base-url: the server's own public origin used to derive the OIDC
#    redirect_uri sent to the IdP. EMPTY derives it from the incoming request
#    (works for single-origin dev/LAN); a prod deployment behind a TLS proxy
#    MUST set it so the IdP always sees the exact registered URI.
#  - binding/handoff TTLs are clamped in code (60..3600 / 10..600 seconds).
keplura.oidc.desktop-redirect-uri=${KEPLURA_OIDC_DESKTOP_REDIRECT_URI:http://localhost:1420/}
keplura.oidc.public-base-url=${KEPLURA_OIDC_PUBLIC_BASE_URL:}
keplura.oidc.binding-ttl-seconds=${KEPLURA_OIDC_BINDING_TTL_SECONDS:600}
keplura.oidc.handoff-ttl-seconds=${KEPLURA_OIDC_HANDOFF_TTL_SECONDS:60}

# PILOT 4e: status file written by scripts/backup.sh after a verified backup;
# read-only for GET /api/v1/admin/backup (compose: storage volume).
keplura.backup.status-file=${KEPLURA_BACKUP_STATUS_FILE:/var/lib/keplura/backup-status.json}

# ADR-0012: Linux-Ordner als Datenquelle nur unterhalb dieser (im Server-Container
# gemounteten, nur lesenden) Wurzeln; kommagetrennt. Leer = Linux-Ordner aus.
keplura.datasource.local-roots=${KEPLURA_DATASOURCE_LOCAL_ROOTS:}

# ADR-0012 §3: Verzeichnis-Gruppen aller Benutzer regelmäßig auffrischen (Minuten, 5–1440).
keplura.directory.refresh-minutes=${KEPLURA_DIRECTORY_REFRESH_MINUTES:15}

# Websuche im Chat (CHAT-02). provider: none | searxng | brave | tavily. Standard: aus.
# searxng: KEPLURA_WEBSEARCH_URL = eigene Instanz (JSON-Format aktivieren); brave/tavily: API-Schlüssel.
keplura.websearch.provider=${KEPLURA_WEBSEARCH_PROVIDER:none}
keplura.websearch.url=${KEPLURA_WEBSEARCH_URL:}
keplura.websearch.api-key=${KEPLURA_WEBSEARCH_API_KEY:}
keplura.websearch.results=${KEPLURA_WEBSEARCH_RESULTS:5}
keplura.websearch.blocked-domains=${KEPLURA_WEBSEARCH_BLOCKED_DOMAINS:}
