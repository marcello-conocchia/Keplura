# Production profile: activate with SPRING_PROFILES_ACTIVE=prod.
# Values stay operational — machine-specific settings come from the environment,
# and secrets are never stored in profile files.

# Port is overridable per deployment without rebuilding.
server.port=${KEPLURA_SERVER_PORT:8080}

# INFO for our own code in production; keep framework logs at the Spring Boot default.
logging.level.com.keplura=INFO

# Datasource (ADR-0002): a production deployment MUST set KEPLURA_DB_URL /
# KEPLURA_DB_USER / KEPLURA_DB_PASSWORD (+ KEPLURA_DB_DRIVER when not the
# default). The fallback is an isolated in-memory H2 — enough for smoke runs of
# the artifact, never a place real data should live. No secret values here.
spring.datasource.url=${KEPLURA_DB_URL:jdbc:h2:mem:keplura-prod-smoke;DB_CLOSE_DELAY=-1}
# Driver is derived from the JDBC URL when KEPLURA_DB_DRIVER stays unset
# (empty default) — the documented Postgres start therefore only needs
# KEPLURA_DB_URL/USER/PASSWORD, and the H2 smoke fallback keeps working.
spring.datasource.driver-class-name=${KEPLURA_DB_DRIVER:}
spring.datasource.username=${KEPLURA_DB_USER:sa}
spring.datasource.password=${KEPLURA_DB_PASSWORD:}

# Datasource (M3a, ADR-0006): against a real PostgreSQL the schema is owned by
# Flyway — V1__baseline.sql (src/main/resources/db/migration) migrates it at
# startup and Hibernate only VALIDATES it (schema drift then fails the boot
# loudly instead of silently mutating prod structures). ddl-auto NEVER stays
# `update` here; `update` is dev/H2-only (see application-dev.properties).
# M3d/ADR-0007: locations carry the PORTABLE chain plus a {vendor} directory
# (Boot replaces it with the JDBC driver id — "postgresql" / "h2"). The
# PostgreSQL-only pgvector migration (CREATE EXTENSION + vector(N) twin table)
# lives in db/migration-postgresql and is therefore invisible to the H2 smoke
# fallback and to the H2 replay test; the empty db/migration-h2 placeholder
# keeps that fallback clean.
spring.flyway.locations=classpath:db/migration,classpath:db/migration-{vendor}
# The H2 in-memory smoke fallback has no Flyway-compatible schema, so for
# smoke runs of the bare artifact ddl-auto stays overridable via
# KEPLURA_DB_DDL_AUTO; a Postgres deployment must keep `validate`.
spring.jpa.hibernate.ddl-auto=${KEPLURA_DB_DDL_AUTO:validate}
spring.flyway.enabled=true
# A database that already carries tables but no flyway_schema_history must NOT
# be silently baselined (that would hide an unknown schema) — fail instead.
# Fresh databases (the compose stack) migrate from V1 normally.
spring.flyway.baseline-on-migrate=false
# The prod smoke fallback runs the SAME V1 baseline against H2, which is the
# documented behaviour here: the baseline SQL is written portable on purpose.
# (dev keeps Flyway disabled — see application-dev.properties.)

# M2b sessions: the login cookie is only sent over HTTPS in production.
# Production runs behind TLS (ADR-0001), so Secure must stay on; a plain-HTTP
# prod deployment without a TLS-terminating proxy silently gets no sessions.
server.servlet.session.cookie.name=KEPLURASESSION
server.servlet.session.cookie.secure=true
