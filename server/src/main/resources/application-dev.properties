# Development profile (active by default, see application.properties).
# Verbose logging for local work; the schema comes from the same Flyway
# migrations as prod (see below).

server.port=8080

# Debug logging for our own code; framework logs stay at the Spring Boot default (INFO).
logging.level.com.keplura=DEBUG

# Datasource (ADR-0002): local persistent H2 file under target/, so dev runs
# keep state without an external database. Override with KEPLURA_DB_* to point
# dev at a real server.
# MODE=PostgreSQL + DATABASE_TO_LOWER=TRUE: the portable migrations run on H2
# exactly as in the Flyway tests (ChatApiIntegrationTest, FlywayBaselineMigrationTest).
# File name `keplura-dev-db` (not the former `keplura-dev`): a database built by
# the old ddl-auto=update workflow has no Flyway history and would refuse to
# start; the old file under target/ is simply no longer used.
spring.datasource.url=${KEPLURA_DB_URL:jdbc:h2:file:./target/keplura-dev-db;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;AUTO_SERVER=TRUE}
spring.datasource.driver-class-name=${KEPLURA_DB_DRIVER:org.h2.Driver}
spring.datasource.username=${KEPLURA_DB_USER:sa}
spring.datasource.password=${KEPLURA_DB_PASSWORD:}

# Schema owned by Flyway, like prod (M3a/ADR-0006). Several tables exist only
# in migrations and are used via JdbcTemplate (chat knowledge bases and
# attachments, MCP, web search settings); with Hibernate ddl-auto=update they
# were never created and those features failed with HTTP 500 in dev.
# Hibernate only validates.
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration,classpath:db/migration-{vendor}
spring.jpa.hibernate.ddl-auto=validate

# Session cookie over plain HTTP for local development (localhost). In every
# real deployment (prod profile) Secure is on — see application-prod.properties.
server.servlet.session.cookie.name=KEPLURASESSION_DEV
server.servlet.session.cookie.secure=false
