[package]
name = "keplura-desktop"
version = "0.1.0"
description = "Keplura Desktop"
license = "Apache-2.0"
edition = "2021"

[lib]
name = "keplura_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
# ADR-0005: native HTTP transport for the auth/orgs API (cookie jar lives in
# Rust; webview JS never sees the session cookie). URL scope is restricted in
# capabilities/default.json — keep both entries in sync with the server's
# keplura.desktop.allowed-origins CORS list.
tauri-plugin-http = "2"

[dev-dependencies]
# Mirror the plugin's exact cookie-jar persistence pipeline (reqwest
# cookie_store + serde_json file format) so the persistence contract that
# ADR-0005 relies on is testable headless, on every CI platform.
cookie_store = { version = "0.22", features = ["serde"] }
serde_json = "1"
url = "2"

[profile.release]
codegen-units = 1
lto = true
strip = true
